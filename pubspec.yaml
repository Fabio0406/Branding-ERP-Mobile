name: branding_erp_mobile
description: Sistema de Recordatorios para Agencia de Branding

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  
  # GraphQL
  graphql_flutter: ^5.1.2
  
  # State Management
  flutter_bloc: ^8.1.3
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  
  # Navigation
  go_router: ^14.2.7
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true